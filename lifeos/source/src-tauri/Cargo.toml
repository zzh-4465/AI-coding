[package]
name = "lifeos"
version = "0.1.0"
description = "LifeOS desktop workspace"
authors = ["LifeOS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
windows = { version = "0.61", features = [
  "Foundation",
  "Storage",
  "Storage_Streams",
  "System_UserProfile"
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
